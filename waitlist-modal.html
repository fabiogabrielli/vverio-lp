<!-- Agenzia waitlist modal: insert before </body> -->
<dialog class="waitlist-modal" id="agenziaWaitlistModal" aria-labelledby="agenziaWaitlistTitle">
  <div class="waitlist-modal-card">
    <button
      class="waitlist-modal-close"
      type="button"
      aria-label="Chiudi"
      data-waitlist-close
    >×</button>

    <div id="agenziaWaitlistFormWrap">
      <span class="kicker">VVERIO AGENZIA</span>
      <h3 id="agenziaWaitlistTitle">Piano Agenzia in arrivo</h3>
      <p>
        Lascia la tua email e ti avviseremo non appena VVERIO Agenzia sarà disponibile.
      </p>

      <form id="agenziaWaitlistForm">
        <label class="waitlist-label" for="agenziaWaitlistEmail">Email professionale</label>
        <input
          class="waitlist-input"
          id="agenziaWaitlistEmail"
          name="email"
          type="email"
          autocomplete="email"
          required
          placeholder="nome@azienda.it"
        />

        <button
          class="btn btn-primary full"
          id="agenziaWaitlistSubmit"
          type="submit"
        >
          Avvisami
        </button>

        <p class="waitlist-error" id="agenziaWaitlistError" hidden>
          Si è verificato un problema. Riprova tra poco.
        </p>
      </form>
    </div>

    <div class="waitlist-success" id="agenziaWaitlistSuccess" hidden>
      <span class="waitlist-success-icon">✓</span>
      <h3>Perfetto.</h3>
      <p>Ti avviseremo quando VVERIO Agenzia sarà disponibile.</p>
      <button class="btn btn-outline full" type="button" data-waitlist-close>
        Chiudi
      </button>
    </div>
  </div>
</dialog>
